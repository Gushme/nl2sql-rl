schema_version: 1
endpoint: https://teacher.example.com/v1
model: deepseek-v4-flash-0731
concurrency: 4
max_retries: 4
retry_base_seconds: 0.5
timeout_seconds: 180.0
max_completion_tokens: 8192
normalized_action_token_limit: 512
temperature: 0.0
seed: 42
enable_thinking: true
reasoning_effort: high
# 单步 Agent 协议禁止服务端在同一轮并行返回多个工具调用。
parallel_tool_calls: false
# 可优先设置累计 Token 硬上限；如需美元费用报告，再从控制台读取真实单价。
token_limit: null
input_price_per_million: 0.0
output_price_per_million: 0.0
max_request_cost_usd: 0.01
real_api: true
collector:
  target_total: 1000
  train_quota: 900
  validation_quota: 100
  max_attempts: 1500
  run_attempt_limit: 100
  diagnostic_batch_size: 100
  concurrency: 4
  seed: 42
  simple_ratio: 0.30
  moderate_ratio: 0.50
  challenging_ratio: 0.20
  confirm_real_api: false
